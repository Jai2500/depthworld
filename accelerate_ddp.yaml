compute_environment: LOCAL_MACHINE
# Plain DDP (no parameter sharding): the full model is replicated on every
# GPU. Alternative to accelerate_fsdp_nowrap.yaml, which the README commands
# use. num_processes is the GPU count (override with --num_processes).
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
