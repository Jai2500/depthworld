compute_environment: LOCAL_MACHINE
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  # NO_WRAP: the whole model is a single FSDP unit (one all-gather per
  # forward instead of many small ones); size-based auto-wrapping hung during
  # FSDP setup in our runs. Parameters, gradients and optimizer state are
  # still sharded across GPUs (FULL_SHARD), at slightly higher peak memory.
  # num_processes below is the GPU count (override with --num_processes).
  fsdp_auto_wrap_policy: NO_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
